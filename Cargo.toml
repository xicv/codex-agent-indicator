[package]
name = "codex-agent-indicator"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
description = "Low-overhead Codex task status indicator for Logitech G915 G-keys"
publish = false

[dependencies]
anyhow = "1.0.104"
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
