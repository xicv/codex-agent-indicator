[package]
name = "codex-agent-indicator"
version = "0.4.5"
edition = "2024"
rust-version = "1.91"
description = "Low-overhead Codex task status indicator for Logitech G915 G-keys"
repository = "https://github.com/xicv/codex-agent-indicator"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["codex", "logitech", "g915", "macos", "status-indicator"]
categories = ["command-line-utilities", "hardware-support"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/config.example.toml",
    "/integrations/**",
    "/launchd/**",
    "/scripts/**",
]

[dependencies]
anyhow = "1.0.104"
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
